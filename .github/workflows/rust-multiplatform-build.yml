name: Beerdex Multiplatform CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------
  # 1. CORE TEST & LINT SUITE
  # -------------------------------------------------------------
  check-core:
    name: Core Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-core-

      - name: Code Formatting Check
        run: cargo fmt --all --check

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Core & Platform Unit Tests
        run: cargo test -p beerdex-core -p beerdex-platform --verbose

      - name: Check wasm32 Target Compilation
        run: cargo check -p beerdex-core -p beerdex-platform -p beerdex-app --lib --target wasm32-unknown-unknown

  # -------------------------------------------------------------
  # 2. WEB & PWA BUILD
  # -------------------------------------------------------------
  build-web:
    name: Build Web & PWA
    needs: check-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (WASM)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked || cargo install wasm-bindgen-cli --locked

      - name: Build Web / WASM Release
        run: |
          mkdir -p dist
          cargo build --release --target wasm32-unknown-unknown -p beerdex-app --lib
          wasm-bindgen target/wasm32-unknown-unknown/release/rustdex.wasm --out-dir wasm --target web || wasm-bindgen target/wasm32-unknown-unknown/release/beerdex_app.wasm --out-dir wasm --target web

      - name: Package Web PWA Release
        run: |
          mkdir -p dist
          cp -r css data event icons images js tests wasm index.html manifest.webmanifest sw.js offline.html poster-classic.html poster-museum.html identity.html CNAME style.css style-museum.css dist/
          cd dist && zip -r ../beerdex-web-pwa.zip . && cd ..

      - name: Upload Web PWA Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beerdex-web-pwa
          path: beerdex-web-pwa.zip

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # 3. WINDOWS NATIVE BUILD (STANDALONE SINGLE .EXE)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Native (.exe)
    needs: check-core
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-win-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Windows Standalone Executable
        run: |
          cargo build --release -p beerdex-app

      - name: Package Windows Single Executable
        shell: pwsh
        run: |
          # Copy standalone binary (all assets, data & wasm are compiled directly inside)
          Copy-Item -Path target/release/beerdex-app.exe -Destination beerdex-windows-x64.exe
          mkdir bin-windows
          Copy-Item -Path target/release/beerdex-app.exe -Destination bin-windows/beerdex.exe
          Compress-Archive -Path bin-windows/beerdex.exe -DestinationPath beerdex-windows-x64.zip

      - name: Upload Windows Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: beerdex-windows-x64
          path: |
            beerdex-windows-x64.exe
            beerdex-windows-x64.zip

  # -------------------------------------------------------------
  # 4. LINUX NATIVE BUILD (STANDALONE SINGLE BINARY)
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux Native (.tar.gz)
    needs: check-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Toolchain (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux Standalone Executable
        run: |
          cargo build --release -p beerdex-app

      - name: Package Linux Single Executable
        run: |
          cp target/release/beerdex-app beerdex-linux-x64
          mkdir -p bin-linux
          cp target/release/beerdex-app bin-linux/beerdex
          tar -czvf beerdex-linux-x64.tar.gz -C bin-linux beerdex

      - name: Upload Linux Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: beerdex-linux-x64
          path: |
            beerdex-linux-x64
            beerdex-linux-x64.tar.gz

  # -------------------------------------------------------------
  # 5. ANDROID NATIVE BUILD (APK & AAB WITH NATIVE RUST .SO)
  # -------------------------------------------------------------
  build-android:
    name: Build Android Native (APK & Play Store AAB)
    needs: [check-core, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Rust Android Targets & cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked || cargo install cargo-ndk

      - name: Build Native Rust Shared Library (.so) for Android
        run: |
          mkdir -p target/android-jni
          cargo ndk -t arm64-v8a -t x86_64 -o target/android-jni build --release -p beerdex-app --lib
          
          # Copy compiled native ARM64 & x86_64 librustdex.so to each variant
          for variant in bd-mobile/*; do
            if [ -d "$variant/android/app/src/main" ]; then
              mkdir -p "$variant/android/app/src/main/jniLibs"
              cp -r target/android-jni/* "$variant/android/app/src/main/jniLibs/"
              echo "✅ Native Rust .so libraries copied to $variant"
            fi
          done

      - name: Auto-Increment Version Code
        run: |
          mkdir -p bd-mobile
          BASE_ONLINE=$(grep "VERSION_CODE_ONLINE=" bd-mobile/version.properties 2>/dev/null | cut -d'=' -f2 || echo "146")
          BASE_OFFLINE=$(grep "VERSION_CODE_OFFLINE=" bd-mobile/version.properties 2>/dev/null | cut -d'=' -f2 || echo "147")
          NEW_ONLINE=$((BASE_ONLINE + ${{ github.run_number }}))
          NEW_OFFLINE=$((BASE_OFFLINE + ${{ github.run_number }}))
          sed -i "s/VERSION_CODE_ONLINE=.*/VERSION_CODE_ONLINE=$NEW_ONLINE/" bd-mobile/version.properties
          sed -i "s/VERSION_CODE_OFFLINE=.*/VERSION_CODE_OFFLINE=$NEW_OFFLINE/" bd-mobile/version.properties
          echo "Build Numbers: Online=$NEW_ONLINE, Offline=$NEW_OFFLINE"

      - name: Setup Keystore
        run: |
          mkdir -p bd-mobile
          if [ -n "${{ secrets.BEERDEX_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.BEERDEX_KEYSTORE_BASE64 }}" | tr -d ' \n\r' | base64 -d > bd-mobile/beerdex.keystore
            echo "Keystore decoded securely from GitHub Secrets."
          else
            echo "::error::GitHub Secret BEERDEX_KEYSTORE_BASE64 is missing! Please configure it in your repository under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run Android Build (AAB & APK)
        run: |
          chmod +x scripts/build-all.sh scripts/sync-mobile.sh
          ./scripts/build-all.sh
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/bd-mobile/beerdex.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.BEERDEX_KEYSTORE_PASSWORD || 'beerdex-secret' }}
          RELEASE_KEY_ALIAS: ${{ secrets.BEERDEX_KEY_ALIAS || 'beerdex-key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.BEERDEX_KEY_PASSWORD || 'beerdex-secret' }}

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beerdex-android-release
          path: release/

  # -------------------------------------------------------------
  # 6. UNIFIED GITHUB RELEASE PUBLISHER
  # -------------------------------------------------------------
  publish-release:
    name: Publish Multiplatform Release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-web, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: beerdex-web-pwa

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: beerdex-windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: beerdex-linux-x64

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: beerdex-android-release
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v5.1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Beerdex v5.1.0 (Latest Multiplatform Release)' }}
          files: |
            beerdex-windows-x64.exe
            beerdex-windows-x64.zip
            beerdex-linux-x64
            beerdex-linux-x64.tar.gz
            beerdex-web-pwa.zip
            release/*.aab
            release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
