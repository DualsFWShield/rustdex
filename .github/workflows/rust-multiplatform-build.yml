name: Beerdex Rust Multiplatform CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------
  # 1. CORE TEST & LINT SUITE
  # -------------------------------------------------------------
  check-core:
    name: Core Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-core-

      - name: Code Formatting Check
        run: cargo fmt --all --check

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Core Test Suite
        run: cargo test --workspace --verbose

  # -------------------------------------------------------------
  # 2. WEB & PWA BUILD
  # -------------------------------------------------------------
  build-web:
    name: Build Web & PWA
    needs: check-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (WASM)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Wasm-Bindgen CLI
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked || cargo install wasm-bindgen-cli --locked

      - name: Build Web / WASM Release
        run: |
          mkdir -p dist
          cargo build --release --target wasm32-unknown-unknown -p beerdex-app --lib
          wasm-bindgen target/wasm32-unknown-unknown/release/beerdex_app.wasm --out-dir dist/wasm --target web
          cp -r css data icons images js index.html manifest.webmanifest sw.js offline.html CNAME style.css style-museum.css dist/ 2>/dev/null || true

      - name: Package Web PWA Artifact
        run: |
          cd dist && zip -r ../beerdex-web-pwa.zip . && cd ..

      - name: Upload Web PWA Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beerdex-web-pwa
          path: beerdex-web-pwa.zip

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # 3. WINDOWS NATIVE BUILD
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Native (.exe)
    needs: check-core
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-win-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Windows Executable
        run: |
          cargo build --release --workspace

      - name: Package Windows Binary
        shell: pwsh
        run: |
          mkdir bin-windows
          Get-ChildItem -Path target/release/*.exe | Copy-Item -Destination bin-windows/
          Compress-Archive -Path bin-windows/* -DestinationPath beerdex-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beerdex-windows-x64
          path: beerdex-windows-x64.zip

  # -------------------------------------------------------------
  # 4. LINUX NATIVE BUILD
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux Native (.deb / Tarball)
    needs: check-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Toolchain (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux Executable
        run: |
          cargo build --release --workspace

      - name: Package Linux Binary
        run: |
          mkdir -p bin-linux
          find target/release -maxdepth 1 -type f -executable -exec cp {} bin-linux/ \;
          tar -czvf beerdex-linux-x64.tar.gz -C bin-linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beerdex-linux-x64
          path: beerdex-linux-x64.tar.gz

  # -------------------------------------------------------------
  # 5. ANDROID NATIVE BUILD (APK & AAB FOR PLAY STORE)
  # -------------------------------------------------------------
  build-android:
    name: Build Android Native (APK & Play Store AAB)
    needs: [check-core, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust Toolchain (WASM for Web Engine)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Wasm-Bindgen CLI
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked || cargo install wasm-bindgen-cli --locked

      - name: Build Web / WASM Release for Android
        run: |
          cargo build --release --target wasm32-unknown-unknown -p beerdex-app --lib
          wasm-bindgen target/wasm32-unknown-unknown/release/beerdex_app.wasm --out-dir wasm --target web

      - name: Auto-Increment Version Code
        run: |
          mkdir -p bd-mobile
          BASE_ONLINE=$(grep "VERSION_CODE_ONLINE=" bd-mobile/version.properties 2>/dev/null | cut -d'=' -f2 || echo "146")
          BASE_OFFLINE=$(grep "VERSION_CODE_OFFLINE=" bd-mobile/version.properties 2>/dev/null | cut -d'=' -f2 || echo "147")
          NEW_ONLINE=$((BASE_ONLINE + ${{ github.run_number }}))
          NEW_OFFLINE=$((BASE_OFFLINE + ${{ github.run_number }}))
          sed -i "s/VERSION_CODE_ONLINE=.*/VERSION_CODE_ONLINE=$NEW_ONLINE/" bd-mobile/version.properties
          sed -i "s/VERSION_CODE_OFFLINE=.*/VERSION_CODE_OFFLINE=$NEW_OFFLINE/" bd-mobile/version.properties
          echo "Build Numbers: Online=$NEW_ONLINE, Offline=$NEW_OFFLINE"

      - name: Setup Keystore
        run: |
          mkdir -p bd-mobile
          if [ -n "${{ secrets.BEERDEX_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.BEERDEX_KEYSTORE_BASE64 }}" | tr -d ' \n' | base64 -d > bd-mobile/beerdex.keystore
            echo "Keystore decoded from GitHub Secrets."
          elif [ -f bd-mobile/beerdex.keystore ]; then
            echo "Using keystore from repository."
          fi

      - name: Run Android Build (AAB & APK)
        run: |
          chmod +x scripts/build-all.sh scripts/sync-mobile.sh
          ./scripts/build-all.sh
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/bd-mobile/beerdex.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.BEERDEX_KEYSTORE_PASSWORD || 'beerdex-secret' }}
          RELEASE_KEY_ALIAS: ${{ secrets.BEERDEX_KEY_ALIAS || 'beerdex-key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.BEERDEX_KEY_PASSWORD || 'beerdex-secret' }}

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beerdex-android-release
          path: release/

  # -------------------------------------------------------------
  # 6. UNIFIED GITHUB RELEASE PUBLISHER
  # -------------------------------------------------------------
  publish-release:
    name: Publish Multiplatform Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-web, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: beerdex-web-pwa

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: beerdex-windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: beerdex-linux-x64

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: beerdex-android-release
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            beerdex-web-pwa.zip
            beerdex-windows-x64.zip
            beerdex-linux-x64.tar.gz
            release/*.aab
            release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
