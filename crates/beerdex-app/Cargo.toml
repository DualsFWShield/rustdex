[package]
name = "beerdex-app"
version = "5.1.0"
edition = "2021"
authors = ["DualsFWShield"]
description = "Universal application engine for Beerdex (Pokédex of beers)"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "beerdex-app"
path = "src/main.rs"

[dependencies]
beerdex-core = { path = "../beerdex-core" }
beerdex-platform = { path = "../beerdex-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc", "now"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tao = "0.37"
wry = "0.57"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
] }
