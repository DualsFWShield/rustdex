[package]
name = "beerdex-platform"
version = "5.1.0"
edition = "2021"
authors = ["DualsFWShield"]
description = "Platform-specific storage, file I/O, and bridge layer for Beerdex"

[dependencies]
beerdex-core = { path = "../beerdex-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "HtmlElement", "Element", "Navigator"] }
