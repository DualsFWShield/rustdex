[package]
name = "beerdex-core"
version = "5.1.0"
edition = "2021"
authors = ["DualsFWShield"]
description = "Core domain logic and data models for Beerdex (Pokédex of beers)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
strsim = "0.11"

[dev-dependencies]
approx = "0.5"
